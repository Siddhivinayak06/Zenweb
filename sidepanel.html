<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenWeb</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="app-container">

    <!-- Compact Header -->
    <header class="compact-header">
      <div class="logo-area">
        <h1>ZenWeb</h1>
        <div id="connection-status" class="status-dot-mini" title="Connection Status"></div>
      </div>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn-small" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="btn-close-settings" class="close-btn">×</button>
      </div>
      <div class="settings-content">
        <!-- Auth Section -->
        <div class="account-card" style="padding:0; border:none; background:transparent;">
          <div id="user-logged-out">
            <p style="font-size:13px; margin-bottom:8px;">Sign in to sync your profile.</p>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <input type="email" id="auth-email-input" placeholder="Email">
              <input type="password" id="auth-password-input" placeholder="Password">
              <button id="btn-login" class="action-btn">Sign In</button>
            </div>
          </div>
          <div id="user-logged-in" class="hidden">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
              <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=random"
                style="width:32px; height:32px; border-radius:50%; object-fit:cover;" alt="Profile">
              <div>
                <div id="user-name" style="font-weight:600;">User</div>
                <div id="user-plan-badge" class="badge">FREE</div>
              </div>
            </div>
            <button id="btn-upgrade-account" class="action-btn" style="margin-bottom:8px; background:#6366f1;">Upgrade
              to Pro</button>
            <button id="btn-logout" class="link-btn">Sign Out</button>
          </div>
        </div>

        <label>Gemini API Key</label>
        <input type="password" id="api-key-input" placeholder="Paste API Key">

        <label>Voice</label>
        <select id="voice-select">
          <option value="auto">Auto</option>
        </select>

        <button id="btn-save-settings" class="action-btn">Save</button>
        <div id="settings-status"></div>
      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">


      <!-- Profile Selector (Primary Navigation) -->
      <div class="profile-section">
        <div class="protection-header"
          style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 class="section-label" style="margin-bottom:0;">Select Your Mode</h3>
          <!-- Ad Blocker Toggle (Prominent) -->
          <div class="protection-toggle" title="Toggle Ad Blocker">
            <span style="font-size:12px; font-weight:600; color:var(--text-secondary); margin-right:8px;">🛡️ Block
              Ads</span>
            <label class="toggle-switch small">
              <input type="checkbox" id="check-adblocker-main" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="profile-grid" id="profile-selector">
          <button class="profile-card" data-profile="adhd">
            <span class="profile-icon">🎯</span>
            <span class="profile-name">ADHD</span>
          </button>
          <button class="profile-card" data-profile="dyslexia">
            <span class="profile-icon">📖</span>
            <span class="profile-name">Dyslexia</span>
          </button>
          <button class="profile-card" data-profile="anxiety">
            <span class="profile-icon">🧘</span>
            <span class="profile-name">Anxiety</span>
          </button>
          <button class="profile-card" data-profile="neuro">
            <span class="profile-icon">🧠</span>
            <span class="profile-name">Neuro</span>
          </button>
          <button class="profile-card" data-profile="vision">
            <span class="profile-icon">👁️</span>
            <span class="profile-name">Vision</span>
          </button>
        </div>

        <!-- Dynamic Hover Info Panel -->
        <div id="mode-info-panel" class="mode-info-panel hidden">
          <div class="info-icon">ℹ️</div>
          <div class="info-content">
            <span id="info-title" style="font-weight:600; font-size:15px; display:block; margin-bottom:4px;">Mode
              Name</span>
            <div id="info-desc" style="font-size:14px; color:#475569; line-height:1.4;">Description</div>
            <div id="feature-detail-box" class="hidden"
              style="margin-top:8px; padding-top:8px; border-top:1px dashed #cbd5e1; font-size:13px; color:#475569; font-style:italic;">
            </div>
          </div>
        </div>
      </div>

      <!-- Adaptive Tools Container -->
      <div id="adaptive-tools" class="adaptive-tools hidden">
        <div class="tools-header">
          <h3 id="active-profile-name">Adaptive Tools</h3>
          <button id="btn-reset-tools" class="link-btn">Change Mode</button>
        </div>

        <div id="tool-container" class="tools-grid">
          <!-- Tools injected via JS -->
        </div>
      </div>
      <!-- Custom Editor -->
      <div id="custom-profile-editor" class="custom-profile-editor hidden">
        <div class="custom-editor-header">
          <h3>Custom Settings</h3>
        </div>
        <div class="custom-control-group">
          <label>Font Size</label>
          <div class="range-slider-container">
            <input type="range" id="custom-font-size" min="10" max="32" value="16">
            <span class="range-value">16</span>
          </div>
        </div>
        <button id="btn-save-custom" class="action-btn" style="padding:8px; font-size:12px;">Apply</button>
      </div>

      <!-- Quick Navigation -->
      <div class="quick-nav" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;">
        <button id="btn-dashboard" class="action-btn-outline">📊 Dashboard</button>
        <button id="btn-website" class="action-btn-outline">🌐 Website</button>
      </div>

      <!-- Appearance Accordion -->
      <details class="section-accordion">
        <summary class="accordion-header">
          <span class="accordion-icon">🎨</span>
          <span class="accordion-title">Appearance</span>
        </summary>
        <div class="accordion-content">
          <div class="setting-row">
            <span>Dyslexia Font</span>
            <label class="toggle-switch small">
              <input type="checkbox" id="check-dyslexia">
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <span>Bionic Reading</span>
            <label class="toggle-switch small">
              <input type="checkbox" id="check-bionic">
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <span>Block Ads <span id="ads-hidden-badge" class="badge hidden">0</span></span>
            <label class="toggle-switch small">
              <input type="checkbox" id="check-adblocker" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="theme-row">
            <button class="theme-chip" data-theme="light">☀️ Light</button>
            <button class="theme-chip" data-theme="sepia">☕ Sepia</button>
            <button class="theme-chip" data-theme="dark">🌙 Dark</button>
          </div>
        </div>
      </details>

      <!-- Chat -->
      <details class="section-accordion">
        <summary class="accordion-header">
          <span class="accordion-icon">💬</span>
          <span class="accordion-title">Chat</span>
        </summary>
        <div class="accordion-content">
          <div id="chat-messages" class="chat-messages-compact">
            <div class="chat-placeholder">Ask about this page...</div>
          </div>
          <div class="chat-input-row" style="margin-top:8px;">
            <input type="text" id="chat-input" placeholder="Type message...">
            <button id="btn-send-chat" class="send-btn-compact">➤</button>
          </div>
        </div>
      </details>

    </main>

    <!-- PRO ACTIONS PANEL -->

    <!-- PRO ACTIONS PANEL -->
    <div id="action-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h2>Action Items</h2>
        <button id="btn-close-actions" class="close-btn">×</button>
      </div>
      <div class="settings-content" id="action-list-container" style="flex:1; overflow-y:auto;"></div>
      <div style="padding-top:10px; display:flex; gap:8px;">
        <button id="btn-copy-actions" class="action-btn">Copy</button>
        <button id="btn-export-actions" class="action-btn" style="background:#1e293b;">Export</button>
      </div>
    </div>

  </div>
  <script type="module" src="sidepanel.js"></script>
</body>

</html>
